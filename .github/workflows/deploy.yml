# Builds the image on every push to main, pushes it to GHCR and points the
# manifests in cnb.cool/StarMoe-org/infra at it (ArgoCD rolls it out).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha,scope=deploy
          cache-to: type=gha,scope=deploy,mode=max

      - name: Update infra
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          git clone -q "https://cnb:${CNB_TOKEN}@cnb.cool/StarMoe-org/infra.git" /tmp/infra
          cd /tmp/infra
          sh hack/bump.sh "${{ steps.img.outputs.name }}" "${{ steps.img.outputs.tag }}" \
            "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
